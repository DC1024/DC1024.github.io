name: Update Bilibili top videos

# 每 24 小时重抓一次 UP 主播放量最高的视频，更新 videos.json、本地素材，
# 并把数据内联进 index.html —— 这样首屏不用再等一次网络往返就能渲染出卡片。
on:
  schedule:
    # 21:10 UTC = 次日 05:10 北京时间，避开整点高峰
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pillow 用来把封面压到 720 宽、并生成 WebP 版本；qrcode 用来生成卡片的分享二维码。
      # 两个都是可选的：装不上脚本会各自降级（退回原图 / 不产出二维码），站点不会挂 ——
      # 所以这里失败也只当警告，不 fail 掉整条流水线。
      - name: Install Pillow + qrcode (optional)
        continue-on-error: true
        run: pip install --quiet pillow qrcode

      - name: Fetch top videos
        id: fetch
        continue-on-error: true
        env:
          BILI_MID: "1970862788"
          BILI_TOP_N: "3"
        # 不用清 http_proxy / HTTP_PROXY —— 脚本内部固定用
        # urllib ProxyHandler({}) 建 opener，本来就不读环境代理。
        # 而且 GitHub Actions 的 YAML 里 http_proxy 与 HTTP_PROXY 视为同一键，
        # 两个都写会直接报 "already defined" 导致 workflow 解析失败。
        run: python scripts/fetch_bilibili_top.py

      - name: Warn when fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::B 站抓取失败，本次保留上一版 videos.json（站点不会挂，只是数据没刷新）"

      # 摄影区那三档 WebP 也从这里生成。它只在 photos-src/（本地目录，已 gitignore）
      # 或既有 assets/photos/ 上工作：本地有 png 就重新生成（幂等，内容没变不会产生提交），
      # 本地没有就什么都不做 —— 所以线上这个 runner 上它实际上是个 no-op，
      # 存在的意义是让「图片是被构建出来的」这件事在流水线里可见、可复现。
      - name: Build photo derivatives (optional)
        continue-on-error: true
        run: python scripts/build_photos.py

      # 素材缺失必须硬失败 —— 绝不能让一份引用了不存在文件的 videos.json 被提交上去。
      # 这个 workflow 有过一次静默删掉已提交雪碧图的记录（后来靠 52cd81e 手工恢复）。
      - name: Verify referenced assets exist
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys

          if not os.path.exists("videos.json"):
              sys.exit("!! videos.json 不存在")
          with open("videos.json", encoding="utf-8") as f:
              data = json.load(f)
          vids = data.get("videos") or []
          if not vids:
              sys.exit("!! videos.json 里没有 videos")

          missing, checked = [], 0
          for v in vids:
              for key in ("cover", "sprite", "qr"):
                  p = v.get(key) or ""
                  if not p.startswith("assets/"):
                      continue          # 远端兜底地址，本地没有是正常的
                  checked += 1
                  if not os.path.exists(p) or os.path.getsize(p) < 2048:
                      missing.append(p)

          # 摄影区同样要校验：photos.json 里每一档（thumb/mid/full）都必须存在。
          # 缺一个,灯箱就会有「点开是空白」的图 —— 那比整块隐藏更糟。
          if os.path.exists("photos.json"):
              with open("photos.json", encoding="utf-8") as f:
                  photos = json.load(f).get("photos") or []
              for p in photos:
                  for key in ("thumb", "mid", "full"):
                      rel = p.get(key) or ""
                      if not rel.startswith("assets/"):
                          continue
                      checked += 1
                      if not os.path.exists(rel) or os.path.getsize(rel) < 1024:
                          missing.append(rel)
              print("摄影素材：%d 张" % len(photos))

          if missing:
              sys.exit("!! 以下素材缺失或是空文件：\n  " + "\n  ".join(sorted(set(missing))))
          print("素材齐全：%d 条视频 / %d 个本地文件" % (len(vids), checked))
          PY

      # 把 videos.json / photos.json 内联进 index.html。标记被删掉时脚本返回 2、这一步会失败 ——
      # 那属于事故，不能静默跳过（静默跳过只会让站点悄悄退回「要等一次网络往返」的版本）。
      - name: Inline seed data into index.html
        run: python scripts/inject_seed.py

      - name: Commit changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # photos.json 与 assets/photos 也要一起提交：index.html 里的 photoSeed 引用了它们，
          # 只提交 index.html 会得到一份指向不存在文件的页面。
          # （photos-src/ 被 gitignore，-A 也不会把原图带进来。）
          git add -A videos.json photos.json assets/videos assets/photos index.html
          git diff --cached --stat
          git commit -m "chore(videos): refresh Bilibili top videos [skip ci]"
          git push

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          [ -f videos.json ] || exit 0
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open("videos.json", encoding="utf-8"))
          print("## B 站 TOP 视频数据\n")
          print("| # | 播放量 | 标题 | 视频 |")
          print("| - | -----: | ---- | ---- |")
          for v in d.get("videos", []):
              print("| %s | %s | %s | [%s](%s) |" % (
                  v.get("rank"), format(v.get("play", 0), ","),
                  v.get("title", ""), v.get("bvid", ""), v.get("url", "")))
          print("\n生成时间：`%s`" % d.get("generated_at", "?"))
          print("\n素材：")
          for v in d.get("videos", []):
              print("- `%s`" % v.get("cover", "?"))
          PY
